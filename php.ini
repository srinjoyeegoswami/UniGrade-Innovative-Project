[PHP]
;;;;;;;;;;;;;;;;;;;;
; UniGrade php.ini ;
;;;;;;;;;;;;;;;;;;;;

extension_dir = "C:\Users\User\AppData\Local\Microsoft\WinGet\Packages\PHP.PHP.8.3_Microsoft.Winget.Source_8wekyb3d8bbwe\ext"

extension=curl
extension=mbstring
extension=mysqli
extension=openssl
extension=pdo_mysql

max_execution_time = 120
memory_limit = 256M
post_max_size = 32M
upload_max_filesize = 32M

display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On

session.save_handler = files
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.name = unigrade_session
session.cookie_lifetime = 7200
session.cookie_path = /
session.cookie_httponly = 1

